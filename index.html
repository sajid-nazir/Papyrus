<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets data-theme before first paint so a stored theme choice doesn't
         flash the wrong colors first — must run before any stylesheet.
         Keep this in sync with STORAGE_KEY in src/hooks/useTheme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('papyrus-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papyrus</title>
    <meta name="description" content="In-browser academic paper search engine with semantic search, knowledge graph visualization, and multi-source support." />
    <meta property="og:title" content="Papyrus" />
    <meta property="og:description" content="In-browser academic paper search engine with semantic search, knowledge graph visualization, and multi-source support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Papyrus" />
    <meta name="twitter:description" content="In-browser academic paper search engine with semantic search, knowledge graph visualization, and multi-source support." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
